[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo-lab"
version = "0.1.0"
description = "A small from-scratch DPO training-step exercise"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
